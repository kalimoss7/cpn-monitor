name: Update Fuel Prices

on:
  schedule:
    # 11:30, 12:30, 14:30 i 16:30 UTC (w zimie 12:30–17:30 CET) od pon. do pt.
    - cron: '30 11,12,14,16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scraper.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "Aktualizacja limitów paliw"
          git push